<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floats</title>

    <style type="text/css">
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            background-color: hsl(140, 80%, 40%);
        }

        main{
            border: 10px solid grey;
            background-color: hsl(210, 100%, 70%);
            width: 50vw;
            margin: 3vh auto;
            aspect-ratio: 2/1;
        }

        #float{
            width: 10vw;
            aspect-ratio: 1/1;
            border: 50px solid #ff8800;
            border-radius: 50%;
        }

        #float2{
           width: 10vw;
            aspect-ratio: 1/1;
            border: 50px solid #ff0088;
            border-radius: 50%; 
        }

        section{
            float: right;
        }

        p{
            font-size: 4vw;
            clear:both;
        }

        .paver{
            float: left;
            width: 150px;
            aspect-ratio: 1/1;
            background-color: grey;
            margin: 1rem;
        }

        #patio{
            width: 40%;
            margin: 0 auto;
        }

    </style>

</head>
<body>
    <main>
        <section id="float"></section>
        <section id="float2"></section>
        <p>🦆</p>
    </main>

    <footer id="patio">
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
        <article class="paver"></article>
    </footer>
    
</body>
</html>
