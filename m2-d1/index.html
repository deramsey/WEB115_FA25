<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2 | Day 1</title>
    <style type="text/css">
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /*box-sizing: content-box*/
        }

        #main{
            width: 60vw;
            background-color: hsl(30, 100%, 50%);
            min-height: 10vh;
            padding: 5%;
            border: 80px solid hsl(30, 100%, 25%);
        }

        section{
            background-color: hsl(60, 100%, 80%);
            width: 80vw;
            padding: 1px;
            margin: 5%;
        }

        p {
            background-color: hsl(90, 100%, 70%);
            width: 60vw;
            min-height: 30vh;
            padding-left: 2%;
            padding-right: 10%;
            padding-top: 15%;
            padding-bottom: 20%;
            padding: 15%, 10%, 20%, 2%;
            border: solid 15px hsl(90, 100%, 25%);
            border-bottom: dashed 5px hsl(90, 100%, 25%);
        }

        h1{
            margin-top: 30%;
        }

        div{
            background-color: red;
            padding: 1px;
        }
    </style>
</head>
<body>
 <section id="main">This is some sample text.</section>
 <section><p>This is some sample text.</p></section>
 <section>This is some sample text.</section>  
 <div><h1></h1></div> 
</body>
</html>
